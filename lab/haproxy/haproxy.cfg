# Load balancer delante de las copias del monolito (lo de la clase de load balancing).
# Cambiá algo y aplicalo con: docker compose restart lb

global
    log stdout format raw local0 info

# DNS de Docker: encuentra las copias nuevas cuando se escala con --scale monolito=N.
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s

defaults
    mode http
    log global
    timeout connect 2s
    timeout client 30s
    timeout server 10s
    log-format "%ci → %s  %ST  %Tt ms  %r"

frontend tienda
    bind :8000
    default_backend monolito

backend monolito
    balance roundrobin
    option httpchk GET /health
    # Si una copia corta la conexión sin responder, el LB reintenta en otra
    # (como haría cualquier cliente): así el mismo pedido con el bug recorre todas las copias.
    retries 3
    retry-on conn-failure empty-response
    option redispatch 1
    http-error status 502 content-type "text/plain; charset=utf-8" string "502 del LB: la copia se cayó sin responder (y las que probó después también)\n"
    http-error status 503 content-type "text/plain; charset=utf-8" string "503 del LB: no queda ninguna copia del monolito viva\n"
    server-template copia 1-6 monolito:3000 check inter 1s fall 1 rise 2 resolvers docker init-addr none

frontend panel
    bind :8404
    stats enable
    stats uri /
    stats refresh 1s
